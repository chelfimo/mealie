name: Skyramp Testbot

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  issue_comment:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.actor != 'skyramp-testbot[bot]' }}

jobs:
  testbot:
    # Only run for pull_request events or issue_comment on PRs mentioning @skyramp-testbot
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@skyramp-testbot') && github.event.comment.user.login != 'skyramp-testbot[bot]')
    runs-on: "ubuntu-latest"
    permissions:
      contents: write
      pull-requests: write
      checks: write

    steps:
      - name: Generate GitHub App Token
        id: skyramp-testbot-app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.SKYRAMP_TESTBOT_APP_ID }}
          private-key: ${{ secrets.SKYRAMP_TESTBOT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          token: ${{ steps.skyramp-testbot-app-token.outputs.token }}

      # ── SKYR-3862 end-to-end validation (temporary) ────────────────────
      # Runs testbot and the MCP server from unreleased branches so the
      # credential-handling change can be exercised before release.
      # Revert this whole block (and restore the pinned `uses:` below) once
      # the change ships.
      #
      # The action source lives in the PRIVATE letsramp/testbot, so it cannot
      # be referenced as `uses: letsramp/testbot@ref` directly — GitHub can
      # only resolve `uses:` against a repo the workflow can read. Check it
      # out to a local path first, then reference that path.
      - name: Check out testbot action from branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: letsramp/testbot
          ref: mourad/SKYR-3862
          token: ${{ secrets.LETSRAMP_READ_PAT }}
          path: .testbot-action

      - uses: ./.testbot-action
        with:
          skyrampLicenseFile: ${{ secrets.SKYRAMP_LICENSE_FILE }}
          anthropicApiKey: ${{ secrets.SKYRAMP_TESTBOT_API_KEY }}
          githubToken: ${{ steps.skyramp-testbot-app-token.outputs.token }}
          targetSetupCommand: "bash testbot/setup.sh"
          targetReadyCheckCommand: "curl -sf http://localhost:9000/api/app/about"
          authTokenCommand: "bash testbot/get-token.sh"
          targetTeardownCommand: "docker compose -f testbot/docker-compose.yml down -v"
          uiCredentials: ${{ secrets.SKYRAMP_UI_CREDENTIALS }}
          # Build the MCP server from the matching branch instead of npm.
          # skyrampMcpVersion is ignored when the source is github.
          skyrampMcpSource: github
          skyrampMcpGithubRef: mourad/SKYR-3862
          skyrampMcpGithubToken: ${{ secrets.LETSRAMP_READ_PAT }}
          skyrampExecutorVersion: "v1.3.29"
